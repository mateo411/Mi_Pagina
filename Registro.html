<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>

    <style>

        body {
            display: flex;
            align-items: center;
            flex-direction: column;
        }

        .Title {
            font-size: 60px;
        }

        p {
            font-size: 20px;
        }

        .Volver {
          border-radius: 4px;
          cursor: pointer;
          font-size: medium;
          margin: 5px;
          transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .Volver:hover {
          transform: translateY(-5px) scale(1.05);
          box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .Volver:active {
          transform: translateY(0) scale(0.98);
        }

        img {
            border-radius: 5px;
            margin: 10px;
        }

    </style>

</head>
<body>
    
    <span class="Title">Uyuyuy...</span>
    <p>Parece que hubo un error de nuestro lado</p>
    <p>Intenta iniciar sesion mas tarde!</p>

    <a href="index.html">
    <button class="Volver">
        Volver a la pagina principal
    </button>
    </a>

    <img src="Imagenes/Uy.png" height="200px" width="200px">


</body>
</html>
